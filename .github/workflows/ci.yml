name: CI

# Run lint, the full hosted test matrix, and Windows installation smoke on every PR, main push, and release tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check

  leak-scan:
    name: Leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks with checksum verification
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${archive}" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan commits for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -n "${PR_BASE_SHA}" ]; then
            range="${PR_BASE_SHA}..HEAD"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "${zero}" ] && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE_SHA}..HEAD"
          else
            range="HEAD"  # new ref, tag, or manual run: scan the full history
          fi
          gitleaks git --config .gitleaks.toml --no-banner --redact --log-opts="--diff-merges=first-parent ${range}" .
          gitleaks git --config .gitleaks-public.toml --no-banner --redact --log-opts="--diff-merges=first-parent ${range}" .
      - name: Scan current tree for secrets
        run: |
          gitleaks dir --config .gitleaks.toml --no-banner --redact .
          gitleaks dir --config .gitleaks-public.toml --no-banner --redact .
      - name: Check tracked files for binaries
        run: python3 scripts/check_public_hygiene.py

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest -q -n 2 -o faulthandler_timeout=30
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/empty-browsers

  browser:
    name: pytest browser (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      CAMPUSCTL_REQUIRE_CHROMIUM: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python 3.12
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q --cov=campusctl --cov-report=json:coverage.json -o faulthandler_timeout=30
      - name: Report per-file and PR diff coverage
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f coverage.json ]; then
            echo "Chromium-inclusive coverage report missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --limit 30 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name browser-coverage --dir baseline || true
          fi
          python scripts/report_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-coverage
          path: |
            coverage.json
            diff-coverage.json
          if-no-files-found: ignore
          retention-days: 30

  windows-smoke:
    name: Windows installation and runtime smoke
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the uv tool and expose its command shims
        shell: pwsh
        run: |
          uv tool install --with-executables-from playwright .
          $toolBin = (uv tool dir --bin).Trim()
          if (-not $toolBin) { throw "uv returned an empty tool bin directory" }
          Add-Content -Path $env:GITHUB_PATH -Value $toolBin
      - name: Verify uv tool commands and UTF-8 CLI responses
        shell: pwsh
        run: |
          @'
          import json
          import os
          import shutil
          import subprocess


          tool_bin = os.path.normcase(os.path.abspath(subprocess.check_output(["uv", "tool", "dir", "--bin"], text=True).strip()))
          for name in ("campusctl", "playwright"):
              path = subprocess.check_output(["powershell", "-NoProfile", "-Command", f"(Get-Command {name}).Source"], text=True).strip()
              if os.path.normcase(os.path.dirname(os.path.abspath(path))) != tool_bin:
                  raise AssertionError(f"{name} did not resolve under the uv tool bin directory: {path}")

          help_result = subprocess.run(["campusctl", "--help", "--json"], capture_output=True, timeout=30)
          if help_result.returncode != 0 or b"Campus LMS control CLI" not in help_result.stdout:
              raise AssertionError("campusctl --help did not complete successfully")

          temp_root = os.path.join(os.environ["RUNNER_TEMP"], "campusctl-smoke-" + os.urandom(8).hex())
          os.makedirs(temp_root)
          env = os.environ.copy()
          env["CAMPUSCTL_CONFIG_DIR"] = os.path.join(temp_root, "config")
          env["CAMPUSCTL_DATA_DIR"] = os.path.join(temp_root, "data")
          for args in (["campusctl", "--version", "--json"], ["campusctl", "doctor", "--json"]):
              result = subprocess.run(args, capture_output=True, timeout=60, env=env)
              try:
                  envelope = json.loads(result.stdout.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as error:
                  raise AssertionError(f"{args} did not produce UTF-8 JSON") from error
              if result.stderr:
                  raise AssertionError(f"{args} wrote unexpected stderr")
              if args[1] == "--version" and (result.returncode != 0 or not envelope["result"].get("version")):
                  raise AssertionError("version response was missing its version")
              if args[1] == "doctor" and (
                  result.returncode != 2
                  or envelope["status"] != "user-action"
                  or envelope["result"].get("display_available") is not None
              ):
                  raise AssertionError("Windows doctor did not report valid setup status and unknown display availability")
          shutil.rmtree(temp_root, ignore_errors=True)
          tool_root = subprocess.check_output(["uv", "tool", "dir"], text=True).strip()
          tool_python = os.path.join(tool_root, "campusctl", "Scripts", "python.exe")
          if not os.path.isfile(tool_python):
              raise AssertionError(f"uv-installed campusctl Python environment was not found: {tool_python}")
          driver = r"""
          import sys
          from campusctl import cli
          from campusctl.envelope import CampusError
          mode = sys.argv[1]
          if mode == "ok":
              cli._dispatch = lambda _: ({"title": "\uac15\uc758"}, None)
              args = ["courses", "list", "--json"]
          elif mode == "error":
              cli._dispatch = lambda _: (None, CampusError("smoke", "\ud14c\uc2a4\ud2b8", None, "error"))
              args = ["courses", "list", "--json"]
          else:
              cli._dispatch = lambda _: ({"title": "\uac15\uc758"}, [CampusError("smoke", "\ud14c\uc2a4\ud2b8")])
              args = ["sync", "--json"]
          raise SystemExit(cli.main(args))
          """
          for mode, expected_status, expected_exit in (("ok", "ok", 0), ("error", "error", 1), ("partial", "partial", 1)):
              response = subprocess.run([tool_python, "-c", driver, mode], capture_output=True, timeout=30)
              if response.returncode != expected_exit or response.stderr:
                  raise AssertionError(f"{mode} response failed: exit={response.returncode}")
              envelope = json.loads(response.stdout.decode("utf-8"))
              if envelope["status"] != expected_status:
                  raise AssertionError(f"{mode} response had unexpected status")
              if mode == "error":
                  if envelope["errors"][0]["message"] != "\ud14c\uc2a4\ud2b8":
                      raise AssertionError("error response did not preserve Korean JSON")
              elif envelope["result"].get("title") != "\uac15\uc758":
                  raise AssertionError(f"{mode} response did not preserve Korean JSON")
          '@ | python -
      - name: Install Chromium
        shell: pwsh
        run: playwright install chromium
      - name: Launch headed Chromium with a bounded wait
        shell: pwsh
        run: |
          @'
          import subprocess
          code = """from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=False)
              browser.close()
          """
          subprocess.run(["uv", "run", "--no-project", "--python", "3.12", "--with", "playwright", "python", "-c", code], timeout=120, check=True)
          '@ | python -
      - name: Exercise disposable Windows Credential Manager entry
        shell: pwsh
        run: |
          @'
          import os
          import secrets
          import sys
          import uuid

          sys.path.insert(0, os.path.join(os.getcwd(), "src"))
          import keyring
          from campusctl.credentials import _backend

          _backend(keyring)
          service = "campusctl-ci-smoke-" + uuid.uuid4().hex
          account = "probe-" + uuid.uuid4().hex
          password = secrets.token_urlsafe(32)
          keyring.set_password(service, account, password)
          try:
              if keyring.get_password(service, account) != password:
                  raise AssertionError("Credential Manager did not return the disposable value")
          finally:
              keyring.delete_password(service, account)
          if keyring.get_password(service, account) is not None:
              raise AssertionError("Disposable Credential Manager entry was not deleted")
          '@ | uv run --no-project --python 3.12 --with keyring python -
