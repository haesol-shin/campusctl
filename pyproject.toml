[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campusctl"
version = "0.4.0"
description = "Campus LMS control CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["playwright>=1.62", "keyring>=24"]

[project.scripts]
campusctl = "campusctl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=7,<8", "pytest-xdist>=3.8,<4", "ruff>=0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/campusctl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["chromium: requires real Playwright Chromium"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
